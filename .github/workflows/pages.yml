# Publishes a PREVIEW of the site to GitHub Pages (https://<user>.github.io/<repo>/) on every push
# to main, for showing work in progress. It is marked noindex. The real site is built for the root
# of its own domain; scripts/pages-preview.mjs adapts the build to the project path.
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the preview is gated (src/components/PreviewGate.astro); the real launch is not
      - run: npm run build
        env:
          PUBLIC_PREVIEW_GATE: 'on'
      - run: node scripts/pages-preview.mjs "/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
